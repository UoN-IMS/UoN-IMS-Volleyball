# Free Supabase projects pause after a week without activity (e.g. over the winter break).
# This reads the league data twice a week so the project stays awake. It changes nothing.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 9 * * 1,4"   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the league data
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js)
          curl -sSf "$URL/rest/v1/docs?select=path&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" > /dev/null
          echo "Supabase answered"
